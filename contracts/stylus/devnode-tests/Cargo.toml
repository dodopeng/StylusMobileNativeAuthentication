[package]
name = "devnode-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Integration harness for the P256Account contract. Generates real P-256
# keypairs, computes the EIP-712 hash off-chain (mirror of the contract's
# logic), signs with low-S normalization, then shells out to `cargo stylus
# deploy` for deployment and `cast` (foundry) for RPC interactions.
#
# NOT part of the deployable artifact. Requires:
#   - a running Nitro devnode at http://localhost:8547
#   - cargo-stylus installed (`cargo install cargo-stylus`)
#   - foundry installed (`cast` on PATH)
#
# Run:   cargo run -p devnode-tests --release

[[bin]]
name = "devnode-tests"
path = "src/main.rs"

[dependencies]
p256 = { version = "=0.13.2", features = ["ecdsa", "arithmetic"] }
rand_core = { version = "0.6", features = ["std"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
hex = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
