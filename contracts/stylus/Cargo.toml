[workspace]
members = [
    "p256-account",
    "devnode-tests",
]
resolver = "2"

[workspace.dependencies]
alloy-primitives = "~0.8.20"
alloy-sol-types = "~0.8.20"
stylus-sdk = "=0.9.0"
ruint = "~1.15.0"

[patch.crates-io]
arbitrary = { git = "https://github.com/rust-fuzz/arbitrary", tag = "v1.3.2" }
derive_arbitrary = { git = "https://github.com/rust-fuzz/arbitrary", tag = "v1.3.2" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
