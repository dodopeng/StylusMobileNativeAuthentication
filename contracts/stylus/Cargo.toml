[workspace]
members = [
    "p256-account",
    "devnode-tests",
]
resolver = "2"

[workspace.dependencies]
alloy-primitives = "~0.8.20"
alloy-sol-types = "~0.8.20"
# `reentrant`: the account MUST tolerate being re-entered. Any protocol that
# returns ETH — WETH.withdraw, a Uniswap swap ending in ETH — calls back into
# `receive()` while `execute` is still on the stack. With the default
# (non-reentrant) build stylus-sdk reverts that callback, which silently breaks
# every ETH-returning action. Enabling it makes the SDK flush storage before
# each external call; nested `execute`/`rotateOwner` are then blocked explicitly
# by the `in_call` guard in lib.rs rather than by a blanket ban.
stylus-sdk = { version = "=0.9.0", features = ["reentrant"] }


[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
